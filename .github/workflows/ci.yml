name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, types & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` needs a lock resolved for the target platform; this one is
      # generated on Windows, where npm hoists the wasm fallbacks differently.
      - run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Booking flow (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `npm ci` needs a lock resolved for the target platform; this one is
      # generated on Windows, where npm hoists the wasm fallbacks differently.
      - run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Serve the production build
        run: npm run preview &

      - name: Wait for the server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5180 > /dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never answered on :5180" >&2
          exit 1

      - name: Run the booking flow suite
        run: python tests/test_booking_flow.py
